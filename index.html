<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f2ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>VW 340 · Portugal 2026</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles-v61.css?v=61">

  <script>
    (function () {
      function closeSplash() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hide');
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 650);
        }
      }
      window.__closeVW340Splash = closeSplash;
      window.setTimeout(closeSplash, 1800);
      window.addEventListener('error', function () {
        window.setTimeout(closeSplash, 150);
      });
      try {
        if (!localStorage.getItem('vw340-v61-cache-cleaned')) {
          localStorage.setItem('vw340-v61-cache-cleaned', '1');
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            });
          }
        }
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div id="splash" class="splash">
    <img src="./icon-512.png" alt="VW 340">
    <strong>BITÁCORA</strong>
    <span>PORTUGAL 2026</span>
  </div>
  <div id="app"></div>
  <script src="./data-v61.js?v=61"></script>
  <script src="./app-v61.js?v=61"></script>
</body>
</html>
